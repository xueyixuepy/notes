<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div id="container">
  <table>
    <thead>
        <tr>
            <th>序号</th>
            <th>姓名</th>
            <th>性别</th>
            <th>头像</th>
            <th>职位</th>
            <th>入职日期</th>
            <th>最后操作时间</th>
            <th>操作</th>
        </tr>
    </thead>
    <tbody>
      <tr v-for="(e,ind) in empList" :key="e.id">
        <td>{{ind+1}}</td>
        <td>{{e.name}}</td>
        <td>{{e.gender == 1?'男':'女'}}</td>
        <td><img v-bind:="e.image" :alt="e.name"></img></td>
        <td>
          <span v-if="e.job == 1">班主任</span>
          <span v-else-if="e.job == 2">讲师</span>
          <span v-else-if="e.job == 3">学工主管</span>
          <span v-else-if="e.job == 4">教研主管</span>
          <span v-else-if="e.job == 5">咨询师</span>
          <span v-else="e.job == 6">其他</span>
          <!--           
          <span v-show="e.job == 1">班主任</span>
          <span v-show="e.job == 2">讲师</span>
          <span v-show="e.job == 3">学工主管</span>
          <span v-show="e.job == 4">教研主管</span>
          <span v-show="e.job == 5">咨询师</span>
          <span v-show="e.job == 6">其他</span>
           -->
        </td>
        <td>{{e.entrydate}}</td>
        <td>{{e.updatetime}}</td>
        <td>
          <button type="button">编辑</button>
          <button type="button">删除</button>
        </td>
      </tr>  

    </tbody>
  </table>
  </div>
  <script type="module">
      import { createApp } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'

      createApp({
        data() {
          return {
            empList: [
              { "id": 1,
                "name": "谢逊",
                "image": "https://web-framework.oss-cn-hangzhou.aliyuncs.com/2023/4.jpg",
                "gender": 1,
                "job": "1",
                "entrydate": "2023-06-09",
                "updatetime": "2024-09-30T14:59:38"
              },
              {
                "id": 2,
                "name": "韦一笑",
                "image": "https://web-framework.oss-cn-hangzhou.aliyuncs.com/2023/1.jpg",
                "gender": 1,
                "job": "1",
                "entrydate": "2020-05-09",
                "updatetime": "2024-09-01T00:00:00"
              },
              {
                "id": 3,
                "name": "黛绮丝",
                "image": "https://web-framework.oss-cn-hangzhou.aliyuncs.com/2023/2.jpg",
                "gender": 2,
                "job": "2",
                "entrydate": "2021-06-01",
                "updatetime": "2024-09-01T00:00:00"
              }
            ]
          }
        }
      }).mount('#container')
  </script>
</body>
</html>
